name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: 8.5.12
  PHP_SHORT_VERSION: '8.5'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image-variant: [ 'franken', 'apache', 'cli', 'fpm', 'supervisor', 'dev', 'supervisor-franken', 'oci' ]
    env:
      VARIANT: ${{ matrix.image-variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: >-
          docker build --pull --platform linux/amd64
          "$VARIANT" --file "$VARIANT/Dockerfile"
          --tag "php-8-debian:check-$VARIANT"
          --build-arg "PHP_VERSION=$PHP_VERSION"

      - name: Verify PHP and image functionality
        run: bash scripts/smoke-test.sh "php-8-debian:check-$VARIANT" "$VARIANT" "$PHP_VERSION"

      - name: Log into registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY_URL }}
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$PASSWORD" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin

      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY_URL }}
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          IMAGE_ID="$REGISTRY/$USERNAME/$IMAGE_NAME"
          for TAG in "$VARIANT-$PHP_VERSION" "$VARIANT-$PHP_SHORT_VERSION" "$VARIANT"; do
            docker tag "php-8-debian:check-$VARIANT" "$IMAGE_ID:$TAG"
            docker push "$IMAGE_ID:$TAG"
          done
          if [ "$VARIANT" = "fpm" ]; then
            docker tag "php-8-debian:check-$VARIANT" "$IMAGE_ID:latest"
            docker push "$IMAGE_ID:latest"
          fi
